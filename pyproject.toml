[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-grid-civic-issue-triage"
version = "0.1.0"
description = "Shared tools for synthetic civic-issue triage development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
omnigrid = "omnigrid.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "PyYAML>=6,<7",
    "ruff>=0.6,<1",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]
pipeline = [
    "ImageHash>=4.3,<5",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "Pillow>=10,<13",
    "piexif>=1.1,<2",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["core"]
include = ["omnigrid*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
