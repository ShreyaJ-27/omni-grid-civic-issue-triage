services:
  - type: web
    name: omni-grid-civic-issue-triage
    runtime: python
    plan: free
    buildCommand: python -m pip install -e ".[api,pipeline]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_MOCK
        value: "true"
